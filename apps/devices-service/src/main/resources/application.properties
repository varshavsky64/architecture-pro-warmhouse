spring.application.name=devices-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/devices
spring.datasource.username=devices
spring.datasource.password=devices
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.kafka.bootstrap-servers=localhost:9092

# temperature-api plays the partner devices in the MVP
devices.emulator.url=http://localhost:8081
# Device types to poll for readings: the temperature sensor and the thermostat from data.sql
devices.readings.type-ids=5c2b8e1a-3f4d-4b6c-9a7e-0d1f2e3a4b51,9a7e5c3b-1d2f-4e6a-8b0c-2d4f6a8c0e11
devices.readings.interval=10000
