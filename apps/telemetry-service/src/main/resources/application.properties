spring.application.name=telemetry-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry
spring.datasource.username=telemetry
spring.datasource.password=telemetry
spring.sql.init.mode=always

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=telemetry-service
spring.kafka.consumer.auto-offset-reset=earliest
